<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermès — Dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1c1f2e;
      --surface2: #252840;
      --border: #2d3148;
      --accent: #5b6af9;
      --text: #e8eaf6;
      --text-muted: #8a8fb5;
      --success: #48c78e;
      --warn: #f0a830;
      --error: #f14668;
      --r: 10px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
    header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.3px; }
    header h1 span { color: var(--accent); }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
    .refresh-btn { background: var(--accent); border: none; color: #fff; padding: 5px 12px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; }
    .refresh-btn:hover { background: #4a59e8; }

    main { max-width: 1200px; margin: 0 auto; padding: 20px 16px; }

    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
    .kpi .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .kpi .value { font-size: 1.7rem; font-weight: 700; }
    .kpi .sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }
    .kpi.green .value { color: var(--success); }
    .kpi.yellow .value { color: var(--warn); }
    .kpi.red .value { color: var(--error); }
    .kpi.blue .value { color: var(--accent); }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
    .card h2 { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }

    .chart-wrap { width: 100%; overflow-x: auto; }
    .chart { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding-bottom: 28px; position: relative; min-width: 200px; }
    .bar-group { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 28px; }
    .bars { display: flex; align-items: flex-end; gap: 2px; height: 100px; }
    .bar { border-radius: 3px 3px 0 0; cursor: default; transition: opacity .15s; }
    .bar:hover { opacity: 0.8; }
    .bar.rev { background: var(--accent); width: 12px; }
    .bar.margin { background: var(--success); width: 12px; }
    .bar-label { font-size: 0.6rem; color: var(--text-muted); white-space: nowrap; margin-top: 4px; transform: rotate(-35deg); transform-origin: top left; }
    .chart-legend { display: flex; gap: 16px; margin-top: 10px; font-size: 0.75rem; color: var(--text-muted); }
    .legend-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: middle; }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th { text-align: left; color: var(--text-muted); font-weight: 500; font-size: 0.73rem; text-transform: uppercase; letter-spacing: 0.4px; padding: 4px 8px 8px; border-bottom: 1px solid var(--border); }
    td { padding: 7px 8px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    .badge { display: inline-block; padding: 2px 7px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; }
    .badge.confirmed { background: #1a3a2a; color: var(--success); }
    .badge.tracking_added { background: #1a2a3a; color: var(--accent); }
    .badge.order_placed { background: #2a2a1a; color: var(--warn); }
    .badge.delivered { background: #1a3a2a; color: #7eeac4; }
    .badge.failed, .badge.verify { background: #3a1a1a; color: var(--error); }
    .badge.pending { background: var(--surface2); color: var(--text-muted); }

    .status-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .status-pill { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 0.78rem; }
    .status-pill .n { font-weight: 700; color: var(--accent); }

    .empty { color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 20px 0; }
    .table-wrap { max-height: 260px; overflow-y: auto; }
    .table-wrap::-webkit-scrollbar { width: 4px; }
    .table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    #error-banner { display: none; background: #3a1a1a; border: 1px solid var(--error); border-radius: var(--r); padding: 10px 16px; margin-bottom: 16px; font-size: 0.85rem; color: var(--error); }
  </style>
</head>
<body>

<header>
  <div class="dot" id="status-dot"></div>
  <h1>Hermès <span>Dashboard</span></h1>
  <div class="header-right">
    <select id="period-sel" onchange="load()">
      <option value="7d">7 jours</option>
      <option value="30d" selected>30 jours</option>
      <option value="90d">90 jours</option>
    </select>
    <button class="refresh-btn" onclick="load()">↻ Actualiser</button>
  </div>
</header>

<main>
  <div id="error-banner"></div>

  <div class="kpi-row">
    <div class="kpi blue">
      <div class="label">Ventes</div>
      <div class="value" id="k-sales">—</div>
    </div>
    <div class="kpi green">
      <div class="label">Revenus</div>
      <div class="value" id="k-rev">—</div>
      <div class="sub">période sélectionnée</div>
    </div>
    <div class="kpi green">
      <div class="label">Marge brute</div>
      <div class="value" id="k-margin">—</div>
      <div class="sub" id="k-margin-pct">—</div>
    </div>
    <div class="kpi yellow">
      <div class="label">Coût fournisseur</div>
      <div class="value" id="k-cost">—</div>
    </div>
    <div class="kpi" id="k-jobs-card">
      <div class="label">Jobs échoués</div>
      <div class="value" id="k-jobs">—</div>
    </div>
  </div>

  <div class="status-bar" id="status-pills"></div>

  <div class="grid2">
    <div class="card">
      <h2>Revenus &amp; Marge / jour</h2>
      <div class="chart-wrap">
        <div class="chart" id="chart-daily"></div>
      </div>
      <div class="chart-legend">
        <span><span class="legend-dot" style="background:var(--accent)"></span>Revenus</span>
        <span><span class="legend-dot" style="background:var(--success)"></span>Marge</span>
      </div>
    </div>

    <div class="card">
      <h2>Top produits</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Produit</th><th>Ventes</th><th>Revenus</th><th>Marge</th></tr>
          </thead>
          <tbody id="top-products"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Ventes actives</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>Statut</th><th>Prix</th><th>Marge</th><th>Suivi</th><th>Date</th></tr>
        </thead>
        <tbody id="sales-table"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
function eur(n) {
  return n == null ? "—" : n.toFixed(2).replace(".", ",") + " €";
}
function pct(n) {
  return n == null ? "—" : n + " %";
}
function fmtDate(s) {
  if (!s) return "—";
  return new Date(s).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" });
}
function badge(status) {
  return `<span class="badge ${status}">${status}</span>`;
}

async function load() {
  const period = document.getElementById("period-sel").value;
  document.getElementById("error-banner").style.display = "none";

  try {
    const [fin, dash] = await Promise.all([
      fetch(`/api/finance?period=${period}`).then(r => r.json()),
      fetch("/api/dashboard").then(r => r.json()),
    ]);

    if (!fin.ok) throw new Error(fin.error ?? "Erreur finance");

    const s = fin.data.summary;

    document.getElementById("k-sales").textContent = s.totalSales;
    document.getElementById("k-rev").textContent = eur(s.revenueEur);
    document.getElementById("k-margin").textContent = eur(s.marginEur);
    document.getElementById("k-margin-pct").textContent = pct(s.marginPct) + " de marge";
    document.getElementById("k-cost").textContent = eur(s.costEur);

    const failedTotal = (fin.data.failedJobs ?? []).reduce((a, j) => a + j.count, 0);
    document.getElementById("k-jobs").textContent = failedTotal;
    document.getElementById("k-jobs-card").className = "kpi " + (failedTotal > 0 ? "red" : "green");

    // Status pills
    document.getElementById("status-pills").innerHTML =
      (fin.data.byStatus ?? []).map(b =>
        `<div class="status-pill">${badge(b.status)}<span class="n">${b.count}</span><span style="color:var(--text-muted)">${eur(b.revenueEur)}</span></div>`
      ).join("");

    // Daily chart
    const daily = fin.data.daily ?? [];
    const chart = document.getElementById("chart-daily");
    chart.innerHTML = "";
    const maxRev = Math.max(...daily.map(d => d.revenueEur), 1);
    if (daily.length) {
      daily.forEach(d => {
        const revH = Math.max(4, Math.round((d.revenueEur / maxRev) * 96));
        const marH = Math.max(2, Math.round((Math.max(0, d.marginEur) / maxRev) * 96));
        const g = document.createElement("div");
        g.className = "bar-group";
        g.title = `${d.day} — Revenu: ${eur(d.revenueEur)} / Marge: ${eur(d.marginEur)}`;
        g.innerHTML =
          `<div class="bars"><div class="bar rev" style="height:${revH}px"></div><div class="bar margin" style="height:${marH}px"></div></div>` +
          `<div class="bar-label">${d.day.slice(5)}</div>`;
        chart.appendChild(g);
      });
    } else {
      chart.innerHTML = '<div class="empty" style="width:100%;align-self:center">Aucune donnée</div>';
    }

    // Top products
    document.getElementById("top-products").innerHTML =
      (fin.data.topProducts ?? []).map(p =>
        `<tr>
          <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.title}">${p.title}</td>
          <td>${p.salesCount}</td>
          <td>${eur(p.revenueEur)}</td>
          <td style="color:var(--success)">${eur(p.marginEur)}</td>
        </tr>`
      ).join("") || `<tr><td colspan="4" class="empty">Aucun produit</td></tr>`;

    // Sales table
    const sales = dash.ok ? (dash.data.activeSales ?? []) : [];
    document.getElementById("sales-table").innerHTML =
      sales.map(v =>
        `<tr>
          <td><code style="font-size:0.75rem">${v.saleId.slice(0, 10)}</code></td>
          <td>${badge(v.status)}</td>
          <td>${eur(v.salePriceEur)}</td>
          <td style="color:var(--success)">${eur(v.salePriceEur - v.costEur)}</td>
          <td style="font-size:0.75rem;color:var(--text-muted)">${v.trackingNumber ?? "—"}</td>
          <td style="color:var(--text-muted)">${fmtDate(v.confirmedAt)}</td>
        </tr>`
      ).join("") || `<tr><td colspan="6" class="empty">Aucune vente active</td></tr>`;

    document.getElementById("status-dot").style.background = "var(--success)";
  } catch (e) {
    document.getElementById("status-dot").style.background = "var(--error)";
    const banner = document.getElementById("error-banner");
    banner.textContent = "Erreur de connexion au backend : " + e.message;
    banner.style.display = "block";
  }
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
